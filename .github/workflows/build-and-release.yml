name: Build Home Assistant NRO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Home Assistant for Switch
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            python3 \
            python3-pip \
            python3-pillow \
            python3-requests \
            python3-bs4 \
            curl \
            jq \
            zip \
            git \
            build-essential

      - name: Generate Home Assistant configuration
        shell: bash
        run: |
          python3 scripts/extract_pwa.py \
            --url "http://192.168.22.63:8123" \
            --name "Home Assistant" \
            --icon "" \
            --output-icon source/icon.jpg \
            --output-hdr source/config.h

      - name: Update application title
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("Makefile")
          text = path.read_text()
          text, count = re.subn(
              r"^APP_TITLE[ \t]*:=.*$",
              "APP_TITLE := Home Assistant",
              text,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(
                  "Expected exactly one APP_TITLE assignment in Makefile."
              )
          path.write_text(text)
          PY

      - name: Compile NRO
        shell: bash
        run: |
          export PATH="/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:$PATH"
          make clean
          make -j"$(nproc)"
          test -s pwa2nx.nro

      - name: Prepare downloadable file
        shell: bash
        run: |
          mkdir -p output
          cp pwa2nx.nro output/Home_Assistant.nro

      - name: Upload Home Assistant NRO
        uses: actions/upload-artifact@v7
        with:
          name: Home-Assistant-Switch
          path: output/Home_Assistant.nro
          if-no-files-found: error
          retention-days: 14
